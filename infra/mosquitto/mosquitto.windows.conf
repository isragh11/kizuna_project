# Mosquitto 2 — configuration de démo pour le mode natif Windows (sans Docker).
# Identique à mosquitto.conf, sans persistance (les chemins /mosquitto/... n'existent pas sous Windows).
# Écoute sur 127.0.0.1 uniquement : aucune règle de pare-feu Windows nécessaire.
# Lancé par scripts/start-services.ps1 :  mosquitto -c infra\mosquitto\mosquitto.windows.conf -v
persistence false

# MQTT TCP (simulateur, consumer, API)
listener 1883 127.0.0.1
allow_anonymous true

# MQTT over WebSocket (clients navigateur éventuels)
listener 9001 127.0.0.1
protocol websockets
